# NeoForge mod metadata for QuickSkin
modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/yourusername/quickskin/issues"

[[mods]]
modId = "quickskin"
version = "${version}"
displayName = "QuickSkin"
displayTest = "IGNORE_ALL_VERSION"
authors = "The Plum Team"
description = '''
QuickSkin - Customize your Minecraft player skin and cape in-game!
Supports Fabric and NeoForge through Architectury.
'''
displayURL = "https://github.com/yourusername/quickskin"
logoFile = "icon.png"

[[mixins]]
config = "quickskin-neoforge.mixins.json"

[[mixins]]
config = "quickskin-ears.mixins.json"

[[dependencies.quickskin]]
modId = "neoforge"
type = "required"
versionRange = "[21.11,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.quickskin]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.11,1.21.12)"
ordering = "NONE"
side = "BOTH"

[[dependencies.quickskin]]
modId = "architectury"
type = "required"
versionRange = "[19.0.1,)"
ordering = "AFTER"
side = "BOTH"
