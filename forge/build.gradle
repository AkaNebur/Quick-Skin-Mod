plugins {
    id 'com.gradleup.shadow'
    id 'com.modrinth.minotaur'
    id 'net.darkhax.curseforgegradle'
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    forge {
        mixinConfig "quickskin.mixins.json"
        mixinConfig "quickskin-ears.mixins.json"
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

// Source sets
sourceSets {
    main {
        java.srcDir 'src/v1_20_1/java'
        resources.srcDir 'src/v1_20_1/resources'
    }
}

// ===== E2E dev-only harness (Forge 1.20.1; never enters the published jar) =====
// Shared core compiled from ../common/src/e2e into this module's `e2e` source set; added only to the
// E2E run configs below (never to shadowBundle/remapJar), so it is absent from build/libs/*.jar.
def e2eSs = sourceSets.create('e2e') {
    java.setSrcDirs(['src/e2e/java', '../common/src/e2e/java'])
    resources.setSrcDirs(['src/e2e/resources', '../common/src/e2e/resources'])
    compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
}

loom {
    // Forge dev only scans exploded dirs listed in fml.modFolders, which Loom populates from this
    // block. Declaring any mod disables auto-detection, so the main mod is declared too. (common loads
    // as a classpath jar, so it needs no entry.)
    mods {
        quickskin {
            sourceSet sourceSets.main
        }
        quick_skin_e2e {
            sourceSet e2eSs
        }
    }
    runs {
        serverE2E {
            server()
            name 'Quick Skin E2E Server (Forge)'
            runDir 'run/server-e2e'
            property 'quickskin.e2e.role', 'server'
        }
        // Scenario is selected by the orchestrator via -Pe2e_scenario (default phase0-smoke for A,
        // propagation for B), so the same run configs serve Phase 0 (1 client) and Phase 1 (A+B).
        clientAE2E {
            client()
            name 'Quick Skin E2E Client A (Forge)'
            runDir 'run/clientA'
            source e2eSs
            property 'quickskin.e2e.enabled', 'true'
            property 'quickskin.e2e.role', 'client_a'
            property 'quickskin.e2e.scenario', (project.findProperty('e2e_scenario') ?: 'phase0-smoke').toString()
            property 'quickskin.e2e.version', 'v1_20_1'
            // Skip Forge's early-display GLFW window: it intermittently fails to grab a primary monitor
            // when a second client window opens right after the first (macOS/headless). The real game
            // window still opens; only the pretty loading screen is skipped.
            property 'fml.earlyprogresswindow', 'false'
            programArgs '--username', 'Alice', '--quickPlayMultiplayer', 'localhost:25565', '--width', '1280', '--height', '720'
        }
        clientBE2E {
            client()
            name 'Quick Skin E2E Client B (Forge)'
            runDir 'run/clientB'
            source e2eSs
            property 'quickskin.e2e.enabled', 'true'
            property 'quickskin.e2e.role', 'client_b'
            property 'quickskin.e2e.scenario', (project.findProperty('e2e_scenario') ?: 'propagation').toString()
            property 'quickskin.e2e.version', 'v1_20_1'
            property 'fml.earlyprogresswindow', 'false'
            programArgs '--username', 'Bob', '--quickPlayMultiplayer', 'localhost:25565', '--width', '1280', '--height', '720'
        }
    }
}

dependencies {
    forge "net.minecraftforge:forge:${project.findProperty('forge_version_1_20_1')}"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-forge:${project.findProperty('architectury_api_version_1_20_1')}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

// ===== PUBLISHING CONFIGURATION =====

def mcVersion = "1.20.1"
def supportedGameVersions = [mcVersion]
def modLoaders = ["forge"]

def changelogFile = rootProject.file(rootProject.property("changelog_file"))
def changelogText = changelogFile.exists() ? changelogFile.text : "No changelog provided"

def modrinthToken = findProperty("modrinth_token") ?: System.getenv("MODRINTH_TOKEN")
def curseforgeToken = findProperty("curseforge_token") ?: System.getenv("CURSEFORGE_TOKEN")

modrinth {
    token = modrinthToken ?: ""
    projectId = rootProject.property("modrinth_id")
    versionNumber = "${project.version}"
    versionName = "Quick Skin ${project.version} [Forge] [MC ${mcVersion}]"
    versionType = "release"
    uploadFile = remapJar
    gameVersions = supportedGameVersions
    loaders = modLoaders
    changelog = changelogText
}

task publishCurseForge(type: net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    dependsOn remapJar
    apiToken = curseforgeToken ?: ""
    def mainFile = upload(rootProject.property("curseforge_id"), remapJar.archiveFile)
    mainFile.changelogType = "markdown"
    mainFile.changelog = changelogText
    mainFile.releaseType = "release"
    supportedGameVersions.each { mainFile.addGameVersion(it) }
    modLoaders.each { mainFile.addModLoader(it) }
    doFirst {
        if (!curseforgeToken) throw new GradleException("curseforge_token not set!")
    }
}

task publishAll {
    group = "publishing"
    description = "Publishes to both Modrinth and CurseForge"
    dependsOn "modrinth", "publishCurseForge"
}
