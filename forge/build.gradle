plugins {
    id 'com.gradleup.shadow'
    id 'com.modrinth.minotaur'
    id 'net.darkhax.curseforgegradle'
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    forge {
        mixinConfig "quickskin.mixins.json"
        mixinConfig "quickskin-ears.mixins.json"
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

// Source sets
sourceSets {
    main {
        java.srcDir 'src/v1_20_1/java'
        resources.srcDir 'src/v1_20_1/resources'
    }
}

dependencies {
    forge "net.minecraftforge:forge:${project.findProperty('forge_version_1_20_1')}"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-forge:${project.findProperty('architectury_api_version_1_20_1')}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

// ===== PUBLISHING CONFIGURATION =====

def mcVersion = "1.20.1"
def supportedGameVersions = [mcVersion]
def modLoaders = ["forge"]

def changelogFile = rootProject.file(rootProject.property("changelog_file"))
def changelogText = changelogFile.exists() ? changelogFile.text : "No changelog provided"

def modrinthToken = findProperty("modrinth_token") ?: System.getenv("MODRINTH_TOKEN")
def curseforgeToken = findProperty("curseforge_token") ?: System.getenv("CURSEFORGE_TOKEN")

modrinth {
    token = modrinthToken ?: ""
    projectId = rootProject.property("modrinth_id")
    versionNumber = "${project.version}"
    versionName = "Quick Skin ${project.version} [Forge] [MC ${mcVersion}]"
    versionType = "release"
    uploadFile = remapJar
    gameVersions = supportedGameVersions
    loaders = modLoaders
    changelog = changelogText
}

task publishCurseForge(type: net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    dependsOn remapJar
    apiToken = curseforgeToken ?: ""
    def mainFile = upload(rootProject.property("curseforge_id"), remapJar.archiveFile)
    mainFile.changelogType = "markdown"
    mainFile.changelog = changelogText
    mainFile.releaseType = "release"
    supportedGameVersions.each { mainFile.addGameVersion(it) }
    modLoaders.each { mainFile.addModLoader(it) }
    doFirst {
        if (!curseforgeToken) throw new GradleException("curseforge_token not set!")
    }
}

task publishAll {
    group = "publishing"
    description = "Publishes to both Modrinth and CurseForge"
    dependsOn "modrinth", "publishCurseForge"
}
