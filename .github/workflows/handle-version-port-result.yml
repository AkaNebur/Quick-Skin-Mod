name: Handle version port result

# GITHUB_TOKEN may dispatch another workflow, but that child run does not emit a recursive
# workflow_run event. The trusted sync workflow therefore starts this coordinator explicitly.
# It polls both exact-head gates, performs at most one Claude repair, and merges only when both
# current runs are green.
on:
  workflow_dispatch:
    inputs:
      head_branch:
        description: Exact automation/sync branch to coordinate
        required: true
        type: string

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: version-port-result-${{ inputs.head_branch }}
  cancel-in-progress: true

jobs:
  handle:
    name: Repair or complete version port
    if: startsWith(inputs.head_branch, 'automation/sync/')
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out the exact port head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.head_branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Wait for both exact-head gates
        id: gates
        shell: bash
        env:
          HEAD_BRANCH: ${{ inputs.head_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          printf 'head_sha=%s\n' "$head_sha" >> "$GITHUB_OUTPUT"
          deadline=$((SECONDS + 5400))
          latest_run() {
            local workflow="$1"
            gh run list --workflow "$workflow" --branch "$HEAD_BRANCH" \
              --event workflow_dispatch --limit 50 \
              --json databaseId,headSha,status,conclusion \
              --jq ".[] | select(.headSha == \"$head_sha\") | [.databaseId,.status,.conclusion] | @tsv" \
              | head -n 1
          }
          while true; do
            build_run="$(latest_run build-gate.yml)"
            e2e_run="$(latest_run on-demand-e2e.yml)"
            build_id=''
            build_status=''
            build_conclusion=''
            e2e_id=''
            e2e_status=''
            e2e_conclusion=''
            if [[ -n "$build_run" ]]; then
              IFS=$'\t' read -r build_id build_status build_conclusion <<< "$build_run"
            fi
            if [[ -n "$e2e_run" ]]; then
              IFS=$'\t' read -r e2e_id e2e_status e2e_conclusion <<< "$e2e_run"
            fi
            printf 'Exact-head gates: build=%s/%s/%s e2e=%s/%s/%s\n' \
              "$build_id" "$build_status" "$build_conclusion" \
              "$e2e_id" "$e2e_status" "$e2e_conclusion"
            if [[ "$build_status" == completed && "$e2e_status" == completed ]]; then
              break
            fi
            if (( SECONDS >= deadline )); then
              printf 'result=timeout\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 20
          done
          if [[ "$build_conclusion" == success && "$e2e_conclusion" == success ]]; then
            printf 'result=success\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          failed_run_id="$build_id"
          if [[ "$build_conclusion" == success ]]; then
            failed_run_id="$e2e_id"
          fi
          printf 'failed_run_id=%s\n' "$failed_run_id" >> "$GITHUB_OUTPUT"
          printf 'result=failure\n' >> "$GITHUB_OUTPUT"

      - name: Report a gate timeout
        if: steps.gates.outputs.result == 'timeout'
        shell: bash
        env:
          HEAD_BRANCH: ${{ inputs.head_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr_number="$(gh pr list --state open --head "$HEAD_BRANCH" \
            --json number --jq '.[0].number')"
          test -n "$pr_number"
          gh pr comment "$pr_number" --body \
            "Timed out waiting for both exact-head gates. Leaving this PR open for review."
          exit 1

      - name: Install all supported JDKs
        if: steps.gates.outputs.result == 'failure'
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - name: Repair one failed gate with Claude
        if: steps.gates.outputs.result == 'failure'
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FAILED_RUN_ID: ${{ steps.gates.outputs.failed_run_id }}
          HEAD_BRANCH: ${{ inputs.head_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr_number="$(gh pr list --state open --head "$HEAD_BRANCH" \
            --json number --jq '.[0].number')"
          test -n "$pr_number"
          if gh pr view "$pr_number" --json labels --jq '.labels[].name' \
              | grep -Fxq ai-repair-attempted; then
            gh pr comment "$pr_number" --body \
              "The latest automated gate still fails after the bounded AI repair. Leaving this PR open for review."
            exit 0
          fi
          gh label create ai-repair-attempted \
            --color D93F0B \
            --description 'One bounded automated repair has been attempted' \
            --force
          gh pr edit "$pr_number" --add-label ai-repair-attempted
          test -n "$CLAUDE_CODE_OAUTH_TOKEN"
          mkdir -p .ai-port-evidence
          gh run view "$FAILED_RUN_ID" --log-failed \
            > .ai-port-evidence/failed-run.log || true
          gh run download "$FAILED_RUN_ID" \
            --dir .ai-port-evidence/artifacts || true
          npm install -g @anthropic-ai/claude-code@2.1.220
          claude --print "Repair the failed trusted automated version-port PR #$pr_number. Read \
          AGENTS.md completely, then inspect .ai-port-evidence/failed-run.log and any artifacts. \
          Preserve the target branch's exact Minecraft version, loaders, matrix and overlays. Fix \
          the root cause in tracked canonical sources or active overlays; never weaken assertions, \
          remove coverage, edit generated output, commit or push. Run the smallest relevant checks." \
            --model claude-opus-5 \
            --allowedTools Read,Edit,Write,Bash \
            --permission-mode acceptEdits
          rm -rf .ai-port-evidence
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check
          python3 scripts/release/matrix.py \
            --matrix release/release-matrix.json > /dev/null
          python3 -m unittest discover -s scripts/release/tests -p 'test_*.py' -v
          test -n "$(git status --porcelain)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: repair automated version port"
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"
          gh workflow run build-gate.yml --ref "$HEAD_BRANCH"
          gh workflow run on-demand-e2e.yml --ref "$HEAD_BRANCH"
          gh pr comment "$pr_number" --body \
            "Claude applied the single bounded repair attempt and redispatched both gates."
          gh workflow run handle-version-port-result.yml --ref master \
            -f head_branch="$HEAD_BRANCH"

      - name: Merge after both exact-head gates pass
        if: steps.gates.outputs.result == 'success'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ steps.gates.outputs.head_sha }}
          HEAD_BRANCH: ${{ inputs.head_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr_number="$(gh pr list --state open --head "$HEAD_BRANCH" \
            --json number --jq '.[0].number')"
          test -n "$pr_number"
          current_head_sha="$(gh pr view "$pr_number" --json headRefOid --jq '.headRefOid')"
          if [[ "$current_head_sha" != "$EXPECTED_HEAD_SHA" ]]; then
            printf 'Port head advanced from %s to %s; a newer coordinator owns it.\n' \
              "$EXPECTED_HEAD_SHA" "$current_head_sha"
            exit 0
          fi
          gh pr comment "$pr_number" --body \
            "Both explicitly dispatched exact-head gates passed; merging the version port."
          gh pr merge "$pr_number" --merge --delete-branch
