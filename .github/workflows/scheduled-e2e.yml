name: Scheduled packaged E2E

on:
  schedule:
    - cron: "23 2 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-packaged-e2e
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  LIBGL_ALWAYS_SOFTWARE: "1"
  GALLIUM_DRIVER: llvmpipe
  __GLX_VENDOR_LIBRARY_NAME: mesa
  NEOFORGE_26_1_ARCHITECTURY_URL: ${{ vars.NEOFORGE_26_1_ARCHITECTURY_URL }}
  NEOFORGE_26_1_ARCHITECTURY_SHA256: ${{ vars.NEOFORGE_26_1_ARCHITECTURY_SHA256 }}
  NEOFORGE_26_1_ARCHITECTURY_MODRINTH_ID: ${{ vars.NEOFORGE_26_1_ARCHITECTURY_MODRINTH_ID }}
  NEOFORGE_26_1_ARCHITECTURY_CURSEFORGE_ID: ${{ vars.NEOFORGE_26_1_ARCHITECTURY_CURSEFORGE_ID }}

jobs:
  build:
    name: Build immutable E2E input bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      anchors: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install all required JDKs
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build ten production artifacts and ten E2E harnesses
        run: >-
          ./gradlew --no-daemon --no-parallel --stacktrace
          clean buildAllLanes buildAllE2EHarnesses

      - name: Stage and verify the ten production artifacts
        run: >-
          python scripts/release/verify_release.py
          --matrix release/release-matrix.json
          --manifest build/release/artifacts.json
          --stage build/release

      - name: Resolve native-anchor matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(python scripts/release/matrix.py \
            --matrix release/release-matrix.json \
            --kind native-anchors)"
          python -c 'import json,sys; value=json.loads(sys.argv[1]); assert value' "$matrix"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

      - name: Upload immutable E2E input bundle
        uses: actions/upload-artifact@v7
        with:
          name: scheduled-e2e-input
          path: build/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  e2e:
    name: ${{ matrix.id }} - four scenarios
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.build.outputs.anchors) }}

    steps:
      - name: Check out orchestration code
        uses: actions/checkout@v6

      - name: Install all required JDKs
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install packaged-runtime launcher
        run: python -m pip install --requirement e2e/requirements.txt

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Install software-rendering runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            xvfb \
            xauth \
            mesa-utils \
            libgl1-mesa-dri \
            libglx-mesa0 \
            libasound2t64 \
            libopenal1 \
            libx11-6 \
            libxcursor1 \
            libxext6 \
            libxi6 \
            libxinerama1 \
            libxrandr2 \
            libxrender1 \
            libxtst6 \
            libxxf86vm1

      - name: Download immutable E2E input bundle
        uses: actions/download-artifact@v8
        with:
          name: scheduled-e2e-input
          path: build/release

      - name: Reverify staged bytes and build identity
        run: python scripts/release/verify_release.py --verify-staged

      - name: Run four packaged-JAR scenarios
        shell: bash
        env:
          E2E_ROW_JSON: ${{ toJSON(matrix) }}
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum \
            --server-args="-screen 0 1280x720x24 -ac +extension GLX +render -noreset" \
            python e2e/orchestrator.py \
              --matrix release/release-matrix.json \
              --row-json "$E2E_ROW_JSON" \
              --artifacts-manifest build/release/artifacts.json \
              --packaged \
              --scenarios phase0-smoke,propagation,propagation-live,full

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scheduled-e2e-${{ matrix.id }}
          path: e2e-out/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 30
