name: Packaged E2E

# The slow lane, and the only one that launches Minecraft: it builds the inputs once, fans the
# four packaged scenarios out across both loaders, then has Claude look at the frames that
# actually rendered. Pull requests run it automatically against only the two lanes declared by
# their target version branch. Version synchronization also dispatches it explicitly because
# events created with GITHUB_TOKEN do not recursively trigger ordinary pull-request workflows.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      attest_run_id:
        description: Internal source run to attest; empty performs packaged E2E
        required: false
        type: string
      attest_branch:
        description: Internal tested automation branch
        required: false
        type: string
      attest_sha:
        description: Internal exact tested commit
        required: false
        type: string
      attest_target_sha:
        description: Internal final release commit
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: packaged-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  LIBGL_ALWAYS_SOFTWARE: "1"
  GALLIUM_DRIVER: llvmpipe
  __GLX_VENDOR_LIBRARY_NAME: mesa

jobs:
  build:
    name: Build immutable E2E input bundle
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.attest_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      anchors: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Verify exact Gradle bootstrap checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd gradle/wrapper && sha256sum --check --strict gradle-wrapper.jar.sha256)
          distribution_hash="$(tr -d '\r\n' < gradle/wrapper/gradle-9.4.0-bin.zip.sha256)"
          grep --fixed-strings --line-regexp "distributionSha256Sum=$distribution_hash" \
            gradle/wrapper/gradle-wrapper.properties

      - name: Install all required JDKs
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Validate central release matrix
        run: python scripts/release/matrix.py --matrix release/release-matrix.json > /dev/null

      - name: Build all production artifacts and E2E harnesses
        run: >-
          ./gradlew --no-daemon --no-parallel --stacktrace
          clean buildAllLanes buildAllE2EHarnesses

      - name: Stage and verify all production artifacts
        run: >-
          python scripts/release/verify_release.py
          --matrix release/release-matrix.json
          --manifest build/release/artifacts.json
          --stage build/release

      - name: Resolve native-anchor matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(python scripts/release/matrix.py \
            --matrix release/release-matrix.json \
            --kind native-anchors)"
          python -c 'import json,sys; value=json.loads(sys.argv[1]); assert value' "$matrix"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

      - name: Upload immutable E2E input bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-input-bundle
          path: build/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  e2e:
    name: ${{ matrix.id }} - four scenarios
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.build.outputs.anchors) }}

    steps:
      - name: Check out exact tested orchestration code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install all required JDKs
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install locked packaged-runtime launcher
        run: >-
          python -m pip install --only-binary=:all:
          --requirement e2e/requirements.txt

      - name: Install software-rendering runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            xvfb \
            xauth \
            mesa-utils \
            libgl1-mesa-dri \
            libglx-mesa0 \
            libasound2t64 \
            libopenal1 \
            libx11-6 \
            libxcursor1 \
            libxext6 \
            libxi6 \
            libxinerama1 \
            libxrandr2 \
            libxrender1 \
            libxtst6 \
            libxxf86vm1

      - name: Download immutable E2E input bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-input-bundle
          path: build/release

      - name: Reverify staged bytes, matrix, and source commit
        run: python scripts/release/verify_release.py --verify-staged

      - name: Run four packaged-JAR scenarios
        shell: bash
        env:
          E2E_ROW_JSON: ${{ toJSON(matrix) }}
          E2E_SCENARIOS: ${{ matrix.scenarios }}
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum \
            --server-args="-screen 0 1920x1080x24 -ac +extension GLX +render -noreset" \
            python e2e/orchestrator.py \
              --matrix release/release-matrix.json \
              --row-json "$E2E_ROW_JSON" \
              --artifacts-manifest build/release/artifacts.json \
              --packaged \
              --scenarios "$E2E_SCENARIOS"

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-e2e-${{ matrix.id }}
          path: |
            e2e-out/summary.json
            e2e-out/resolved-matrix.json
            e2e-out/profiles/**/result.json
            e2e-out/profiles/**/logs/**
            e2e-out/profiles/**/e2e-report/**
            e2e-out/profiles/**/screenshots/**
            e2e-out/profiles/**/crash-reports/**
          if-no-files-found: warn
          compression-level: 6
          retention-days: 1

  visual-review:
    name: AI visual review
    needs: e2e
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Every anchor uploads its own evidence artifact; merge them so the manifest sees the
      # frames from both loaders in one e2e-out tree, which is where visual_review.py looks.
      - name: Fetch packaged behavior evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: packaged-e2e-*
          merge-multiple: true
          path: e2e-out

      - name: Build the review manifest
        run: |
          echo "screenshots: $(find e2e-out -name '*.png' | wc -l)"
          python3 e2e/visual_review.py > visual-review-manifest.json
          python3 -c "import json;print('frames to review:', len(json.load(open('visual-review-manifest.json'))))"

      # Driven through the Claude Code CLI rather than claude-code-action, which rejects
      # several of the event types this repository actually runs on.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.220

      # The programmatic E2E assertions verify mod state and pixel deltas. This step is the
      # only thing in the pipeline that judges whether a frame shows what it should.
      - name: Review rendered frames
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude --print "$(cat e2e/visual_review_prompt.md)" \
            --model claude-opus-5 \
            --allowedTools Read,Write \
            --permission-mode acceptEdits

      - name: Gate on the review
        run: |
          python3 e2e/check_visual_review.py \
            --report visual-review-report.json \
            --manifest visual-review-manifest.json

      - name: Upload the review report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-review
          path: |
            visual-review-manifest.json
            visual-review-report.json
          if-no-files-found: warn
          retention-days: 3

  attest:
    name: Attest tested E2E on release branch
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.attest_run_id != ''
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/verify-gate-attestation.yml
    with:
      source_run_id: ${{ inputs.attest_run_id }}
      source_workflow: on-demand-e2e.yml
      tested_branch: ${{ inputs.attest_branch }}
      tested_sha: ${{ inputs.attest_sha }}
      target_sha: ${{ inputs.attest_target_sha }}

  notify-version-port:
    name: Notify version port controller
    needs:
      - build
      - e2e
      - visual-review
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.attest_run_id == '' &&
      startsWith(github.ref_name, 'automation/sync/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Dispatch the settled E2E result
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          VISUAL_RESULT: ${{ needs.visual-review.result }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          conclusion=success
          for result in "$BUILD_RESULT" "$E2E_RESULT" "$VISUAL_RESULT"; do
            if [[ "$result" != success ]]; then
              conclusion=failure
            fi
          done
          jq -n \
            --arg gate on-demand-e2e.yml \
            --arg conclusion "$conclusion" \
            --arg head_branch "$GITHUB_REF_NAME" \
            --arg head_sha "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg source_event "$GITHUB_EVENT_NAME" \
            --arg source_repository "$GITHUB_REPOSITORY" \
            '{event_type:"version-port-gate-completed",client_payload:{gate:$gate,conclusion:$conclusion,head_branch:$head_branch,head_sha:$head_sha,run_id:$run_id,source_event:$source_event,source_repository:$source_repository}}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input -
