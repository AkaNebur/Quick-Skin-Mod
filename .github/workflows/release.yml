name: Release

on:
  push:
    tags:
      - "mc*-v*"
  # Manual runs are validation-only. Publication requires the canonical tag, which avoids a
  # second path that could create/move a tag while another release run is already active.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  LIBGL_ALWAYS_SOFTWARE: "1"
  GALLIUM_DRIVER: llvmpipe
  __GLX_VENDOR_LIBRARY_NAME: mesa

jobs:
  build:
    name: Build immutable release bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      release_id: ${{ steps.release.outputs.release_id }}
      tag: ${{ steps.release.outputs.tag }}
      branch: ${{ steps.release.outputs.branch }}
      runtimes: ${{ steps.matrices.outputs.runtimes }}
      artifacts: ${{ steps.matrices.outputs.artifacts }}
      publications: ${{ steps.matrices.outputs.publications }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Verify exact Gradle bootstrap checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd gradle/wrapper && sha256sum --check --strict gradle-wrapper.jar.sha256)
          distribution_hash="$(tr -d '\r\n' < gradle/wrapper/gradle-9.4.0-bin.zip.sha256)"
          grep --fixed-strings --line-regexp "distributionSha256Sum=$distribution_hash" \
            gradle/wrapper/gradle-wrapper.properties

      - name: Install all required JDKs
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          # The stable branch build gate owns cache writes. A tagged release may wait for an
          # environment approval, so it restores that cache without creating a tag-scoped copy.
          cache-read-only: true

      - name: Validate requested release identity
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          identity="$(python scripts/release/release_identity.py)"
          release_branch="$(jq -r .branch <<< "$identity")"
          branch_head="$(gh api \
            "repos/$GITHUB_REPOSITORY/branches/$release_branch" --jq .commit.sha)"
          python scripts/release/release_identity.py \
            --validate-ci \
            --release-branch-head "$branch_head" \
            --github-output "$GITHUB_OUTPUT" > /dev/null

      - name: Validate central release matrix
        run: python scripts/release/matrix.py --matrix release/release-matrix.json > /dev/null

      - name: Build all production artifacts and E2E harnesses
        run: >-
          ./gradlew --no-daemon --no-parallel --stacktrace
          clean buildAllLanes buildAllE2EHarnesses

      - name: Stage and verify all production artifacts
        run: >-
          python scripts/release/verify_release.py
          --matrix release/release-matrix.json
          --manifest build/release/artifacts.json
          --stage build/release

      - name: Rebuild every production and harness JAR for reproducibility
        run: >-
          ./gradlew --no-daemon --no-parallel --stacktrace --rerun-tasks
          buildAllLanes buildAllE2EHarnesses

      - name: Prove first and second build bytes are identical
        run: >-
          python scripts/release/verify_reproducibility.py
          --matrix release/release-matrix.json
          --manifest build/release/artifacts.json

      - name: Resolve release matrices
        id: matrices
        shell: bash
        run: |
          set -euo pipefail
          runtimes="$(python scripts/release/matrix.py \
            --matrix release/release-matrix.json \
            --kind runtime)"
          artifacts="$(python scripts/release/matrix.py \
            --matrix release/release-matrix.json \
            --kind artifacts)"
          publications="$(python scripts/release/matrix.py \
            --matrix release/release-matrix.json \
            --kind publications)"
          python -c 'import json,sys; value=json.loads(sys.argv[1]); assert value' "$runtimes"
          python -c 'import json,sys; value=json.loads(sys.argv[1]); assert value' "$artifacts"
          python -c 'import json,sys; value=json.loads(sys.argv[1]); assert value' "$publications"
          printf 'runtimes=%s\n' "$runtimes" >> "$GITHUB_OUTPUT"
          printf 'artifacts=%s\n' "$artifacts" >> "$GITHUB_OUTPUT"
          printf 'publications=%s\n' "$publications" >> "$GITHUB_OUTPUT"

      - name: Attest exact production JAR provenance
        if: ${{ github.event_name == 'push' }}
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: build/release/files/*.jar

      - name: Attest exact production JAR SBOM
        if: ${{ github.event_name == 'push' }}
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: build/release/files/*.jar
          sbom-path: build/release/sbom/quick-skin.cdx.json

      - name: Assert the release build did not mutate tracked sources
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload immutable release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ steps.release.outputs.release_id }}
          path: build/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Upload release-build diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-diagnostics
          path: |
            **/build/reports/
            **/build/test-results/
            **/build/*.log
          if-no-files-found: ignore
          retention-days: 1

  runtime-behavior:
    name: ${{ matrix.id }} - packaged release behavior
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.build.outputs.runtimes) }}

    steps:
      - name: Check out exact tested orchestration code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install all required JDKs
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install locked packaged-runtime launcher
        run: >-
          python -m pip install --only-binary=:all:
          --requirement e2e/requirements.txt

      - name: Install software-rendering runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            xvfb \
            xauth \
            mesa-utils \
            libgl1-mesa-dri \
            libglx-mesa0 \
            libasound2t64 \
            libopenal1 \
            libx11-6 \
            libxcursor1 \
            libxext6 \
            libxi6 \
            libxinerama1 \
            libxrandr2 \
            libxrender1 \
            libxtst6 \
            libxxf86vm1

      - name: Download immutable release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.build.outputs.release_id }}
          path: build/release

      - name: Reverify staged bytes, matrix, and source commit
        run: python scripts/release/verify_release.py --verify-staged

      - name: Run all packaged-JAR release scenarios
        shell: bash
        env:
          E2E_ROW_JSON: ${{ toJSON(matrix) }}
          E2E_SCENARIOS: ${{ matrix.scenarios }}
        run: |
          set -euo pipefail
          xvfb-run --auto-servernum \
            --server-args="-screen 0 1920x1080x24 -ac +extension GLX +render -noreset" \
            python e2e/orchestrator.py \
              --matrix release/release-matrix.json \
              --row-json "$E2E_ROW_JSON" \
              --artifacts-manifest build/release/artifacts.json \
              --packaged \
              --scenarios "$E2E_SCENARIOS"

      - name: Upload packaged-behavior evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-behavior-${{ matrix.id }}
          path: |
            e2e-out/summary.json
            e2e-out/resolved-matrix.json
            e2e-out/profiles/**/result.json
            e2e-out/profiles/**/logs/**
            e2e-out/profiles/**/e2e-report/**
            e2e-out/profiles/**/screenshots/**
            e2e-out/profiles/**/crash-reports/**
          if-no-files-found: warn
          compression-level: 6
          retention-days: 1

  stage-github-release:
    name: Stage exact GitHub Release assets
    needs:
      - build
      - runtime-behavior
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write

    steps:
      - name: Check out exact release source and tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Download immutable release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.build.outputs.release_id }}
          path: build/release

      - name: Reverify staged bytes before creating a draft
        run: python scripts/release/verify_release.py --verify-staged

      - name: Reconcile or create the draft and upload exact assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/release/github_release.py stage
          --repository "$GITHUB_REPOSITORY"
          --tag "${{ needs.build.outputs.tag }}"
          --commit "$GITHUB_SHA"
          --title "Quick Skin ${{ needs.build.outputs.release_id }}"

  publish-marketplace:
    name: Publish ${{ matrix.artifact_node }} to ${{ matrix.marketplace }}
    needs:
      - build
      - runtime-behavior
      - stage-github-release
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.build.outputs.publications) }}

    steps:
      - name: Check out release metadata
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Download immutable release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.build.outputs.release_id }}
          path: build/release

      - name: Reverify staged bytes before publication
        run: python scripts/release/verify_release.py --verify-staged

      - name: Reconcile existing marketplace publication by identity and hash
        id: reconcile
        env:
          MODRINTH_TOKEN: ${{ matrix.marketplace == 'modrinth' && secrets.MODRINTH_TOKEN || '' }}
          CURSEFORGE_TOKEN: ${{ matrix.marketplace == 'curseforge' && secrets.CURSEFORGE_TOKEN || '' }}
        run: >-
          python scripts/release/reconcile_publication.py
          --artifact-node "${{ matrix.artifact_node }}"
          --marketplace "${{ matrix.marketplace }}"
          --publication-id "${{ matrix.publication_id }}"
          --github-output "$GITHUB_OUTPUT"

      - name: Publish exact verified artifact to Modrinth
        if: ${{ matrix.marketplace == 'modrinth' && steps.reconcile.outputs.publish == 'true' }}
        uses: Kira-NT/mc-publish@995edadc13559a8b28d0b7e6571229f067ec7659 # v3.3.0
        with:
          modrinth-id: ${{ matrix.modrinth_id }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: ${{ matrix.file }}
          name: ${{ matrix.name }}
          version: ${{ matrix.publication_id }}
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: ${{ matrix.loader }}
          game-versions: ${{ matrix.game_versions }}
          game-version-filter: none
          dependencies: ${{ matrix.dependencies }}
          java: ${{ matrix.java }}
          retry-attempts: 3
          retry-delay: 10000
          fail-mode: fail

      - name: Publish exact verified artifact to CurseForge
        if: ${{ matrix.marketplace == 'curseforge' && steps.reconcile.outputs.publish == 'true' }}
        uses: Kira-NT/mc-publish@995edadc13559a8b28d0b7e6571229f067ec7659 # v3.3.0
        with:
          curseforge-id: ${{ matrix.curseforge_id }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ matrix.file }}
          name: ${{ matrix.name }}
          version: ${{ matrix.publication_id }}
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: ${{ matrix.loader }}
          game-versions: ${{ matrix.game_versions }}
          game-version-filter: none
          dependencies: ${{ matrix.dependencies }}
          java: ${{ matrix.java }}
          retry-attempts: 3
          retry-delay: 10000
          fail-mode: fail

      - name: Verify marketplace ID and exact bytes after publication
        env:
          MODRINTH_TOKEN: ${{ matrix.marketplace == 'modrinth' && secrets.MODRINTH_TOKEN || '' }}
          CURSEFORGE_TOKEN: ${{ matrix.marketplace == 'curseforge' && secrets.CURSEFORGE_TOKEN || '' }}
        run: >-
          python scripts/release/reconcile_publication.py
          --artifact-node "${{ matrix.artifact_node }}"
          --marketplace "${{ matrix.marketplace }}"
          --publication-id "${{ matrix.publication_id }}"
          --verify
          --record "build/publication/${{ matrix.id }}.json"

      - name: Upload publication receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-${{ matrix.id }}
          path: build/publication/${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 1

  publish-github-release:
    name: Publish immutable GitHub Release
    needs:
      - build
      - stage-github-release
      - publish-marketplace
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write

    steps:
      - name: Check out exact release source and tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Download immutable release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.build.outputs.release_id }}
          path: build/release

      - name: Reverify staged bytes before final publication
        run: python scripts/release/verify_release.py --verify-staged

      - name: Publish the fully reconciled GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/release/github_release.py publish
          --repository "$GITHUB_REPOSITORY"
          --tag "${{ needs.build.outputs.tag }}"
          --commit "$GITHUB_SHA"
          --title "Quick Skin ${{ needs.build.outputs.release_id }}"
