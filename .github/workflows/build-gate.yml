name: Build gate

# The fast lane: everything that can be checked without launching Minecraft. It runs on every
# push and pull request so a broken compile, a bad matrix, or a build that dirties tracked
# sources is caught immediately.
#
# Packaged E2E remains a separate workflow so version branches can run both gates independently.
on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      attest_run_id:
        description: Internal source run to attest; empty performs the full build
        required: false
        type: string
      attest_branch:
        description: Internal tested automation branch
        required: false
        type: string
      attest_sha:
        description: Internal exact tested commit
        required: false
        type: string
      attest_target_sha:
        description: Internal final release commit
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: build-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    name: Build and verify
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.attest_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Verify exact Gradle bootstrap checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd gradle/wrapper && sha256sum --check --strict gradle-wrapper.jar.sha256)
          distribution_hash="$(tr -d '\r\n' < gradle/wrapper/gradle-9.4.0-bin.zip.sha256)"
          grep --fixed-strings --line-regexp "distributionSha256Sum=$distribution_hash" \
            gradle/wrapper/gradle-wrapper.properties

      - name: Install all required JDKs
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Validate central matrix
        run: python scripts/release/matrix.py --matrix release/release-matrix.json > /dev/null

      - name: Validate release tooling and repository policy
        run: |
          python -m py_compile \
            scripts/release/matrix.py \
            scripts/release/status_table.py \
            scripts/release/verify_release.py \
            scripts/release/version_branches.py \
            e2e/orchestrator.py \
            e2e/packaged_runtime.py \
            e2e/visual_review.py
          python -m unittest discover -s scripts/release/tests -p 'test_*.py' -v

      - name: Build all production artifacts and E2E harnesses
        run: >-
          ./gradlew --no-daemon --no-parallel --stacktrace
          clean buildAllLanes buildAllE2EHarnesses

      - name: Stage and verify all production artifacts
        run: >-
          python scripts/release/verify_release.py
          --matrix release/release-matrix.json
          --manifest build/release/artifacts.json
          --stage build/release

      - name: Assert the build did not mutate tracked sources
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload build diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-gate-diagnostics
          path: |
            **/build/reports/
            **/build/test-results/
            **/build/*.log
            **/run/logs/
          if-no-files-found: ignore
          retention-days: 3

  attest:
    name: Attest tested build on release branch
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.attest_run_id != ''
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/verify-gate-attestation.yml
    with:
      source_run_id: ${{ inputs.attest_run_id }}
      source_workflow: build-gate.yml
      tested_branch: ${{ inputs.attest_branch }}
      tested_sha: ${{ inputs.attest_sha }}
      target_sha: ${{ inputs.attest_target_sha }}

  notify-version-port:
    name: Notify version port controller
    needs: build
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.attest_run_id == '' &&
      startsWith(github.ref_name, 'automation/sync/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Dispatch the settled build result
        shell: bash
        env:
          GATE_CONCLUSION: ${{ needs.build.result }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -n \
            --arg gate build-gate.yml \
            --arg conclusion "$GATE_CONCLUSION" \
            --arg head_branch "$GITHUB_REF_NAME" \
            --arg head_sha "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg source_event "$GITHUB_EVENT_NAME" \
            --arg source_repository "$GITHUB_REPOSITORY" \
            '{event_type:"version-port-gate-completed",client_payload:{gate:$gate,conclusion:$conclusion,head_branch:$head_branch,head_sha:$head_sha,run_id:$run_id,source_event:$source_event,source_repository:$source_repository}}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input -
