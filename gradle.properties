org.gradle.jvmargs=-Xmx2G
# Architectury 3.5.167 communicates transformer classpaths through JVM-global system properties.
# Mixed-version transformProduction* tasks must therefore execute serially in the aggregate graph.
org.gradle.parallel=false
# Dependency verification is repository policy, not an opt-in CI flag. Verbose failures keep the
# exact rejected coordinate visible in headless logs without weakening strict mode.
org.gradle.dependency.verification=strict
org.gradle.dependency.verification.console=verbose
# org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-21.0.9.10-hotspot

mod_version=3.0.0
maven_group=com.theplumteam.quick-skin
archives_name=quick-skin

# Architectury embeds this stable identity into its generated PlatformMethods package. Keep the
# pre-Stonecutter identity so Phase 0 artifacts retain the oracle's transformed class inventory.
architectury_inject_id=d6d53dbaef6e4a1e8e7b75f2a160bab5

# ===== IDE DEFAULT =====
# Stonecutter node paths select builds; this value remains for older IDE/run helpers.
minecraft_version=26.1.1

